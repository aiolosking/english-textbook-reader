<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{{PAGE_TITLE}}</title>
<style>
  :root{
    --bg1:#f6f8ff; --bg2:#eef3fb;
    --card:#ffffff; --ink:#1e293b; --muted:#64748b;
    --brand:#4f46e5; --brand2:#0ea5e9; --brand-soft:#eef2ff; --brand-line:#c7d2fe;
    --hot:#f59e0b; --hot2:#f97316; --hot-soft:rgba(249,115,22,.26);
    --line:#e2e8f0; --radius:18px;
    --shadow:0 10px 30px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;}
  body{background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;}
  button{font-family:inherit;border:none;cursor:pointer;border-radius:14px;
    font-size:15px;font-weight:600;letter-spacing:.2px;padding:11px 16px;min-height:46px;min-width:46px;
    transition:transform .06s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease, color .18s ease;}
  button:active{transform:scale(.96);}
  button:focus-visible,select:focus-visible{outline:3px solid rgba(79,70,229,.4);outline-offset:2px;}
  button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}

  /* header */
  header{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    justify-content:space-between;padding:10px 16px;
    background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(15,23,42,.05);}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .logo{flex:0 0 auto;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 4px 12px rgba(79,70,229,.35);}
  .logo::after{content:"";width:0;height:0;margin-left:3px;
    border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;}
  header h1{font-size:17px;margin:0;font-weight:800;line-height:1.2;}
  header .sub{font-size:12px;color:var(--muted);}
  .nav{display:flex;gap:4px;align-items:center;background:#eef2f7;border:1px solid var(--line);
    border-radius:999px;padding:4px;}
  .nav button{background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;min-height:38px;font-size:14px;}
  .nav button:hover:not(:disabled){background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.12);}
  #pageLabel{font-size:14px;font-weight:700;min-width:64px;text-align:center;color:var(--brand);}

  /* layout */
  main{display:flex;gap:16px;padding:16px;align-items:flex-start;max-width:1200px;margin:0 auto;}
  .stage{flex:1 1 60%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;box-shadow:var(--shadow);}
  .imgwrap{position:relative;width:100%;max-width:100%;margin:0 auto;}
  .imgwrap img{display:block;width:100%;height:auto;border-radius:12px;user-select:none;-webkit-user-drag:none;
    box-shadow:0 2px 10px rgba(15,23,42,.10);}

  /* hotspots (geometry untouched; only feedback styling) */
  .spot{position:absolute;border:2px solid transparent;border-radius:10px;background:transparent;cursor:pointer;
    transition:background .15s ease, box-shadow .15s ease;}
  .spot:hover{background:rgba(79,70,229,.10);box-shadow:inset 0 0 0 2px rgba(79,70,229,.35);}
  .spot.active{background:var(--hot-soft);border-color:var(--hot);
    box-shadow:0 0 0 3px rgba(249,115,22,.28);animation:pulse 1.1s ease-out infinite;}
  .spot.noaudio{cursor:default;}
  .spot.noaudio:hover{background:transparent;box-shadow:none;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(249,115,22,.45);}70%{box-shadow:0 0 0 9px rgba(249,115,22,0);}100%{box-shadow:0 0 0 0 rgba(249,115,22,0);}}

  /* panel */
  .panel{flex:1 1 40%;min-width:280px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);max-height:84vh;overflow:auto;}
  .panel::-webkit-scrollbar{width:8px;}
  .panel::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}
  .panel::-webkit-scrollbar-track{background:transparent;}

  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--line);
    border-radius:14px;padding:8px;margin-bottom:12px;}
  button.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    box-shadow:0 6px 16px rgba(79,70,229,.30);}
  button.primary:hover{box-shadow:0 8px 20px rgba(79,70,229,.40);transform:translateY(-1px);}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  button.ghost:hover:not(:disabled){background:#f1f5f9;border-color:#cbd5e1;}
  button.toggle[aria-pressed="true"]{background:linear-gradient(135deg,var(--hot),var(--hot2));color:#fff;
    border-color:transparent;box-shadow:0 5px 14px rgba(249,115,22,.35);}
  .controls .gap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 8px;}
  select{font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);padding:6px 8px;border-radius:10px;
    border:1px solid var(--line);background:#fff;min-height:36px;cursor:pointer;}

  /* now playing bar */
  .npbar{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--brand-soft),#f0f9ff);
    border:1px solid var(--brand-line);border-radius:12px;padding:10px 12px;margin-bottom:12px;min-height:46px;}
  .eq{flex:0 0 auto;width:18px;height:16px;display:flex;gap:2px;align-items:flex-end;}
  .eq i{flex:1;background:var(--brand);border-radius:2px;height:30%;transition:height .2s ease;}
  body[data-mode="playing"] .eq i{animation:eq 0.9s ease-in-out infinite;}
  body[data-mode="playing"] .eq i:nth-child(2){animation-delay:.15s;}
  body[data-mode="playing"] .eq i:nth-child(3){animation-delay:.3s;}
  body[data-mode="paused"] .eq i{height:30%;}
  @keyframes eq{0%,100%{height:25%;}50%{height:100%;}}
  #nowPlaying{flex:1;font-size:15px;font-weight:600;color:var(--ink);line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* sentence list */
  .sec-title{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--brand);font-weight:800;
    letter-spacing:.4px;margin:14px 2px 7px;}
  .sec-title::before{content:"";width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand2));}
  ul.lines{list-style:none;margin:0;padding:0;}
  ul.lines li{position:relative;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:8px 10px;margin-bottom:6px;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease, transform .06s ease;}
  ul.lines li:hover{border-color:var(--brand-line);box-shadow:0 3px 10px rgba(15,23,42,.08);transform:translateY(-1px);}
  ul.lines li.active{background:var(--brand-soft);border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(79,70,229,.14);}
  ul.lines li.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:4px;
    background:linear-gradient(180deg,var(--brand),var(--brand2));}
  ul.lines li .txt{font-size:16.5px;line-height:1.4;flex:1;}
  ul.lines li .play{flex:0 0 auto;width:40px;height:40px;min-width:40px;min-height:40px;padding:0;border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:13px;
    display:grid;place-items:center;box-shadow:0 3px 10px rgba(79,70,229,.30);}
  ul.lines li .play:hover{transform:scale(1.07);}
  ul.lines li.noaudio{background:#f8fafc;border-style:dashed;}
  ul.lines li.noaudio:hover{transform:none;box-shadow:none;border-color:var(--line);}
  ul.lines li.noaudio .play{display:none;}
  ul.lines li.noaudio .txt{color:var(--muted);}
  .badge{font-size:11px;font-weight:600;background:#eef2f7;color:#475569;border:1px solid var(--line);
    border-radius:999px;padding:3px 9px;white-space:nowrap;}
  .badge.ans{background:#fff7ed;color:#9a3412;border-color:#fed7aa;}

  footer{padding:18px;text-align:center;color:var(--muted);font-size:12px;}

  @media (max-width:820px){
    main{flex-direction:column;padding:10px;gap:12px;}
    .panel{max-height:none;width:100%;}
    header{padding:8px 10px;}
    header h1{font-size:15px;}
    .nav{margin-left:auto;}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>{{HEADER_TITLE}}</h1>
      <div class="sub">{{HEADER_SUB}}</div>
    </div>
  </div>
  <div class="nav">
    <button id="prev" class="ghost" aria-label="上一页">◀ 上一页</button>
    <span id="pageLabel">第 3 页</span>
    <button id="next" class="ghost" aria-label="下一页">下一页 ▶</button>
  </div>
</header>

<main>
  <section class="stage">
    <div class="imgwrap" id="imgwrap">
      <img id="pageImg" alt="课本页面">
      <!-- hotspots injected -->
    </div>
  </section>

  <aside class="panel">
    <div class="controls">
      <button id="playAll" class="primary">▶ 整课连播</button>
      <button id="pauseBtn" class="ghost">⏸ 暂停</button>
      <button id="repeatBtn" class="toggle ghost" aria-pressed="false" title="单句重复">🔁 单句重复</button>
      <button id="followBtn" class="toggle ghost" aria-pressed="false" title="跟读模式">🎤 跟读</button>
      <label class="gap">停顿
        <select id="gapSel"><option value="2">2秒</option><option value="3" selected>3秒</option><option value="5">5秒</option></select>
      </label>
      <button id="stopBtn" class="ghost">⏹ 停止</button>
    </div>
    <div class="npbar">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <div id="nowPlaying">未播放</div>
    </div>
    <div id="listBox"></div>
  </aside>
</main>

<footer>音频为配套录音按句切分（保留原声，未使用合成语音）；标注“无音频”的条目在录音中没有对应内容，不提供播放。{{FOOTER_EXTRA}}</footer>

<audio id="au" preload="none"></audio>

<script src="data.js"></script>
<script>
(function(){
  const au = document.getElementById('au');
  const img = document.getElementById('pageImg');
  const wrap = document.getElementById('imgwrap');
  const listBox = document.getElementById('listBox');
  const nowPlaying = document.getElementById('nowPlaying');
  const pageLabel = document.getElementById('pageLabel');
  const pauseBtn = document.getElementById('pauseBtn');

  const byId = {}; DATA.items.forEach(it=>byId[it.id]=it);
  let pageIdx = 0;
  let currentId = null;
  let queue = [];          // ids to play in order (连播)
  let qPos = -1;
  let chaining = false;    // whether we are in a 连播/跟读 chain
  let followTimer = null;  // active gap timer (跟读停顿)
  let pendingNextId = null;// clip queued to play after a gap
  let repeat = false, follow = false;
  let mode = 'idle';       // 'idle' | 'playing' | 'paused'  — single source of truth

  function gapMs(){ return follow ? parseInt(document.getElementById('gapSel').value,10)*1000 : 0; }
  function clearGap(){ if(followTimer){ clearTimeout(followTimer); followTimer=null; } }

  /* 让整页课本图在平板/桌面上完整落入视口高度；热区按百分比定位，随缩放同步 */
  const stageEl = document.querySelector('.stage');
  function fitStage(){
    if(!stageEl) return;
    wrap.style.width = '100%';                 // 先释放上次的固定宽度，否则量到的是旧宽度
    const cs = getComputedStyle(stageEl);
    const availW = stageEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if(availW <= 0) return;
    const natW = img.naturalWidth || 1, natH = img.naturalHeight || 1;
    const headH = (document.querySelector('header')||{getBoundingClientRect:()=>({height:0})}).getBoundingClientRect().height;
    const availH = Math.max(240, window.innerHeight - headH - 56);
    let w = availW;
    if(w * natH / natW > availH) w = availH * natW / natH;
    wrap.style.width = Math.max(200, Math.min(availW, Math.round(w))) + 'px';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', ()=>setTimeout(fitStage, 120));
  img.addEventListener('load', fitStage);
  function setPauseLabel(){ pauseBtn.textContent = (mode==='paused') ? '▶ 继续' : '⏸ 暂停'; document.body.dataset.mode = mode; }

  function setPage(i){
    pageIdx = Math.max(0, Math.min(DATA.pages.length-1, i));
    const pg = DATA.pages[pageIdx];
    pageLabel.textContent = '第 ' + pg.num + ' 页';
    img.src = pg.imgd || ('images/' + pg.file);
    // hotspots
    wrap.querySelectorAll('.spot').forEach(e=>e.remove());
    pg.spots.forEach(sp=>{
      const it = byId[sp.id];
      const d = document.createElement('div');
      d.className = 'spot' + (it && it.clip ? '' : ' noaudio');
      d.dataset.id = sp.id;
      d.style.left = sp.x+'%'; d.style.top = sp.y+'%';
      d.style.width = sp.w+'%'; d.style.height = sp.h+'%';
      d.title = it ? it.text : sp.id;
      if(it && it.clip){ d.addEventListener('click', ()=>{ stopChain(); playId(sp.id); }); }
      wrap.appendChild(d);
    });
    fitStage();
    renderList();
    document.getElementById('prev').disabled = pageIdx===0;
    document.getElementById('next').disabled = pageIdx===DATA.pages.length-1;
  }

  function renderList(){
    const pg = DATA.pages[pageIdx];
    listBox.innerHTML = '';
    let lastSec = null;
    pg.items.forEach(id=>{
      const it = byId[id]; if(!it) return;
      if(it.sec !== lastSec){
        lastSec = it.sec;
        const h = document.createElement('div'); h.className='sec-title'; h.textContent = it.sec;
        listBox.appendChild(h);
        const ul = document.createElement('ul'); ul.className='lines'; ul.dataset.sec=it.sec;
        listBox.appendChild(ul);
      }
      const ul = listBox.querySelector('ul[data-sec="'+CSS.escape(it.sec)+'"]');
      const li = document.createElement('li');
      li.dataset.id = id;
      if(!it.clip) li.classList.add('noaudio');
      if(id===currentId) li.classList.add('active');
      const btn = document.createElement('button');
      btn.className='play'; btn.textContent='▶'; btn.setAttribute('aria-label','播放');
      btn.disabled = !it.clip;                 // 按钮只作视觉/键盘入口，点击统一交给整行
      const tx = document.createElement('span'); tx.className='txt'; tx.textContent = it.text;
      li.appendChild(btn); li.appendChild(tx);
      if(it.tag){ const b=document.createElement('span'); b.className='badge'+(it.tag==='答案'?' ans':''); b.textContent=it.tag; li.appendChild(b); }
      if(!it.clip){ const b=document.createElement('span'); b.className='badge'; b.textContent='无音频'; li.appendChild(b); }
      if(it.clip){                             // 整行可点：平板/手机上点句子文字即可朗读
        li.style.cursor = 'pointer';
        li.addEventListener('click', ()=>{ stopChain(); playId(id); });
      }
      ul.appendChild(li);
    });
  }

  function highlight(id){
    currentId = id;
    wrap.querySelectorAll('.spot').forEach(e=>e.classList.toggle('active', e.dataset.id===id));
    listBox.querySelectorAll('li').forEach(e=>e.classList.toggle('active', e.dataset.id===id));
    const it = byId[id];
    nowPlaying.textContent = it ? ('正在播放：' + it.text) : '未播放';
  }

  function highlightClear(){
    currentId=null;
    wrap.querySelectorAll('.spot').forEach(e=>e.classList.remove('active'));
    listBox.querySelectorAll('li').forEach(e=>e.classList.remove('active'));
    nowPlaying.textContent='未播放';
  }

  function playId(id){
    const it = byId[id];
    if(!it || !it.clip){ return false; }
    // ensure the page showing this item is visible
    const pgi = DATA.pages.findIndex(p=>p.items.includes(id));
    if(pgi !== -1 && pgi !== pageIdx){ setPage(pgi); }
    pendingNextId = null;
    clearGap();
    au.pause();
    const target = it.d || ('audio/' + it.file);
    if(au.getAttribute('src') !== target){ au.src = target; }  // avoid reload gap when repeating same clip
    try{ au.currentTime = 0; }catch(e){}
    mode = 'playing';
    setPauseLabel();
    highlight(id);
    au.play().catch(err=>{ nowPlaying.textContent = '播放失败：' + err.message; });
    return true;
  }

  function stopChain(){ chaining=false; qPos=-1; queue=[]; clearGap(); pendingNextId=null; }

  function finishChain(){
    chaining=false; qPos=-1; queue=[];
    clearGap(); pendingNextId=null;
    au.pause(); mode='idle'; setPauseLabel();
    nowPlaying.textContent='连播结束';
    wrap.querySelectorAll('.spot').forEach(e=>e.classList.remove('active'));
    listBox.querySelectorAll('li').forEach(e=>e.classList.remove('active'));
    currentId=null;
  }

  // advance to the next clip AFTER the current one ended (gap falls between sentences)
  function advanceChain(){
    qPos++;
    if(qPos >= queue.length){ finishChain(); return; }
    const id = queue[qPos];
    const gap = gapMs();
    if(gap > 0){
      pendingNextId = id;
      clearGap();
      followTimer = setTimeout(()=>{
        followTimer=null;
        const nid = pendingNextId; pendingNextId=null;
        if(mode==='playing' && nid){ playId(nid); }
      }, gap);
    } else {
      playId(id);
    }
  }

  au.addEventListener('ended', ()=>{
    if(mode !== 'playing') return;   // ignore stray 'ended' when paused/idle
    if(repeat && currentId){ playId(currentId); return; }
    if(chaining){ advanceChain(); return; }
    // single tap, no repeat: keep highlight, return to idle
    mode='idle'; setPauseLabel();
  });

  // 连播: all items with audio, in book order, starting from the current page
  document.getElementById('playAll').addEventListener('click', ()=>{
    stopChain();
    queue = DATA.order.filter(id=>byId[id] && byId[id].clip);
    const pg = DATA.pages[pageIdx];
    const firstIdx = queue.findIndex(id=>pg.items.includes(id));
    qPos = (firstIdx>=0 ? firstIdx : 0);
    chaining = true;
    if(qPos < queue.length){ playId(queue[qPos]); }  // first clip immediately, no leading gap
    else { finishChain(); }
  });

  pauseBtn.addEventListener('click', function(){
    if(mode === 'playing'){
      if(followTimer){ clearGap(); }   // paused during a follow gap; pendingNextId retained
      else { au.pause(); }
      mode='paused'; setPauseLabel();
    } else if(mode === 'paused'){
      mode='playing'; setPauseLabel();
      if(pendingNextId){               // resume the interrupted gap
        const gap = gapMs();
        clearGap();
        followTimer = setTimeout(()=>{
          followTimer=null;
          const nid = pendingNextId; pendingNextId=null;
          if(mode==='playing' && nid){ playId(nid); }
        }, gap);
      } else {
        au.play();
      }
    }
    // mode === 'idle': nothing to resume
  });

  document.getElementById('stopBtn').addEventListener('click', ()=>{
    stopChain(); au.pause(); au.currentTime=0;
    mode='idle'; setPauseLabel();
    highlightClear();
  });

  document.getElementById('repeatBtn').addEventListener('click', function(){
    repeat = !repeat; this.setAttribute('aria-pressed', repeat);
  });
  document.getElementById('followBtn').addEventListener('click', function(){
    follow = !follow; this.setAttribute('aria-pressed', follow);
  });

  document.getElementById('prev').addEventListener('click', ()=>setPage(pageIdx-1));
  document.getElementById('next').addEventListener('click', ()=>setPage(pageIdx+1));

  setPage(0);
})();
</script>
</body>
</html>
